version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: focusflow
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://app:password@postgres:5432/focusflow
      - DATABASE_SSL=false
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - AI_MODEL=${AI_MODEL}
      - MIGRATIONS_DIR=/sql/migrations
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_BYTES=10485760
      - TZ=Europe/London
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5174}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/api:/app
      - ./sql:/sql:ro
      - uploads_data:/app/uploads
      - /app/node_modules

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://app:password@postgres:5432/focusflow
      - DATABASE_SSL=false
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - AI_MODEL=${AI_MODEL}
      - TZ=Europe/London
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5174}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./workers/ai:/app
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=http://localhost:8080

volumes:
  postgres_data:
  uploads_data:
